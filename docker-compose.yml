services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://viralcuts:viralcuts@db:5432/viralcuts
      DIRECT_URL: postgresql://viralcuts:viralcuts@db:5432/viralcuts
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3000
    ports:
      - "3000:3000"
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: viralcuts
      POSTGRES_PASSWORD: viralcuts
      POSTGRES_DB: viralcuts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralcuts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
